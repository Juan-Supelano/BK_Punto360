# HU-20: la API (FastAPI) con 2 réplicas. La imagen sale de ghcr.io (HU-19).
#
# - Configuración no sensible: ConfigMap punto360-config (01-configmap.yaml).
# - Credenciales: Secret punto360-secret (plantilla en secret.example.yaml).
# - Readiness en /listo: el pod recibe tráfico solo cuando llega a la base.
# - Liveness en /salud: si la API deja de responder, Kubernetes reinicia el pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: punto360-api
  namespace: punto360
  labels:
    app: punto360-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: punto360-api
  template:
    metadata:
      labels:
        app: punto360-api
    spec:
      containers:
        - name: api
          image: ghcr.io/juan-supelano/punto360-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: punto360-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: punto360-secret
                  key: DATABASE_URL
            - name: JWT_SECRETO
              valueFrom:
                secretKeyRef:
                  name: punto360-secret
                  key: JWT_SECRETO
            - name: IA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: punto360-secret
                  key: IA_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /listo
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /salud
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: punto360-api
  namespace: punto360
  labels:
    app: punto360-api
spec:
  selector:
    app: punto360-api
  ports:
    - name: http
      port: 8080
      targetPort: http