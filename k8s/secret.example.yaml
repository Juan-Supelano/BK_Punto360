# HU-23: plantilla del Secret con las credenciales de la API y la base.
#
# Este archivo NO tiene valores reales y no se aplica tal cual. Se copia como
# k8s/secret.yaml (que está en .gitignore, nunca se sube), se cambian los
# valores y se aplica:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml        (Windows: copy ...)
#   kubectl apply -f k8s/secret.yaml
#
# Para generar valores aleatorios:
#   python -c "import secrets; print(secrets.token_hex(32))"
#
# La API no arranca si JWT_SECRETO tiene menos de 32 caracteres o sigue
# empezando por CAMBIAR (validación en backend/app/config.py).
#
# Lo leen: 02-postgres.yaml (POSTGRES_PASSWORD) y 03-api.yaml (DATABASE_URL y
# JWT_SECRETO). La configuración no sensible va en 01-configmap.yaml.
# La IA predictiva corre dentro de la API, sin servicios externos: no necesita
# claves de API.
apiVersion: v1
kind: Secret
metadata:
  name: punto360-secret
  namespace: punto360
type: Opaque
# stringData acepta texto plano; Kubernetes lo guarda en base64.
stringData:
  # Contraseña del usuario postgres del StatefulSet.
  POSTGRES_PASSWORD: "CAMBIAR_CONTRASENA_POSTGRES"
  # Debe usar la misma contraseña de POSTGRES_PASSWORD y el host "postgres".
  DATABASE_URL: "postgresql+psycopg://postgres:CAMBIAR_CONTRASENA_POSTGRES@postgres:5432/proyecto_nube"
  # Llave de firma de los tokens JWT (mínimo 32 caracteres).
  JWT_SECRETO: "CAMBIAR_POR_UN_VALOR_GENERADO_CON_TOKEN_HEX_32"
