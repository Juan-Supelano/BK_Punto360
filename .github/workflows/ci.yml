name: CI

# HU-06: valida cada PR hacia desarrollo y main.
# Cada paso revisa si existe su carpeta, porque el proyecto se migra por HU
# y al principio desarrollo no tiene backend ni frontend.

on:
  pull_request:
    branches: [desarrollo, main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (dependencias + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements.txt') != ''
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Lint con ruff (errores de sintaxis, nombres e imports)
        if: hashFiles('backend/requirements.txt') != ''
        run: ruff check backend --select E9,F

      - name: Sin backend todavía
        if: hashFiles('backend/requirements.txt') == ''
        run: echo "backend/ aún no está en esta rama; se omite."

  frontend:
    name: Frontend (instalación + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "20"

      - name: Instalar dependencias
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint --if-present

      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build

      - name: Sin frontend todavía
        if: hashFiles('frontend/package-lock.json') == ''
        working-directory: .
        run: echo "frontend/ aún no está en esta rama; se omite."
