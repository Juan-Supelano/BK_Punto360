name: CI

# HU-06: valida cada PR hacia desarrollo y main.
# HU-11: corre las pruebas del backend contra una base PostgreSQL temporal.
# Cada paso revisa si existe su carpeta, porque el proyecto se migra por HU.

on:
  pull_request:
    branches: [desarrollo, main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + pruebas)
    runs-on: ubuntu-latest
    services:
      # Base temporal del job: se crea y se destruye en cada ejecución y no
      # guarda datos reales, por eso su contraseña puede ir aquí.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pos_test
      # Llave de prueba: solo firma tokens de la base temporal del CI. Debe
      # tener 32 caracteres o más (validación de HU-23 en app/config.py).
      JWT_SECRETO: llave-de-pruebas-del-ci-sin-valor-real-0001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: hashFiles('backend/requirements.txt') != ''
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: hashFiles('backend/requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-dev.txt ]; then
            pip install -r backend/requirements-dev.txt
          else
            pip install ruff
          fi

      - name: Lint con ruff (errores de sintaxis, nombres e imports)
        if: hashFiles('backend/requirements.txt') != ''
        run: ruff check backend --select E9,F

      - name: Cargar esquema y datos de prueba
        if: hashFiles('backend/tests/**') != ''
        run: |
          psql -h localhost -U postgres -d pos_test -v ON_ERROR_STOP=1 -q -f database/schema.sql
          psql -h localhost -U postgres -d pos_test -v ON_ERROR_STOP=1 -q -f database/seed.sql

      - name: Pruebas con cobertura
        if: hashFiles('backend/tests/**') != ''
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

      - name: Sin backend todavía
        if: hashFiles('backend/requirements.txt') == ''
        run: echo "backend/ aún no está en esta rama; se omite."

  frontend:
    name: Frontend (instalación + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: hashFiles('frontend/package-lock.json') != ''
        with:
          node-version: "20"

      - name: Instalar dependencias
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm ci

      - name: Lint
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run lint --if-present

      - name: Build
        if: hashFiles('frontend/package-lock.json') != ''
        run: npm run build

      - name: Sin frontend todavía
        if: hashFiles('frontend/package-lock.json') == ''
        working-directory: .
        run: echo "frontend/ aún no está en esta rama; se omite."
